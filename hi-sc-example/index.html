<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HOMAG Intelligence Planner</title>
    <link rel="stylesheet" href="/src/style.css" />
    <script type="module" src="/src/main.ts"></script>
  </head>

  <body>
    <main id="sign-in-view" class="sign-in">
      <form id="sign-in" class="card">
        <hgroup>
          <h1>Sign in</h1>
          <p>Plan with HOMAG Intelligence and its AI Planning Assistant.</p>
        </hgroup>
        <fieldset>
          <legend>HI server</legend>
          <label>
            User
            <input
              name="user"
              autocomplete="username"
              autocapitalize="off"
              autocorrect="off"
              spellcheck="false"
              required
            />
          </label>
          <label>
            Password
            <input
              name="password"
              type="password"
              autocomplete="current-password"
              required
            />
          </label>
        </fieldset>
        <fieldset>
          <legend>Library</legend>
          <label>
            Backend ID
            <input
              name="backendId"
              value="HI_PRE_Roomle_Milestone_2"
              autocapitalize="off"
              spellcheck="false"
              required
            />
          </label>
          <label>
            Library
            <input
              name="libraryId"
              value="Furniture_Smith"
              autocapitalize="off"
              spellcheck="false"
              required
            />
          </label>
        </fieldset>
        <fieldset>
          <legend>AI chat (optional)</legend>
          <label>
            Model
            <input
              name="model"
              list="models"
              placeholder="gpt-6-astra"
              autocapitalize="off"
              spellcheck="false"
            />
          </label>
          <label>
            API key
            <input name="apiKey" type="password" autocomplete="off" />
          </label>
        </fieldset>
        <p class="error" role="alert"></p>
        <button type="submit">Start planning</button>
      </form>
      <datalist id="models">
        <option value="gpt-6-astra"></option>
        <option value="gpt-6.1-sol"></option>
        <option value="gpt-5.4-mini"></option>
        <option value="gpt-5-mini"></option>
        <option value="mistral-large-3"></option>
        <option value="mistral-medium"></option>
        <option value="mistral"></option>
        <option value="claude"></option>
        <option value="gemini"></option>
      </datalist>
    </main>
    <div id="planner" hidden></div>
  </body>
</html>
