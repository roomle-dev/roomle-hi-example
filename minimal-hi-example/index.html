<!doctype html>
<html lang="en">
  <head>
    <title>HI Presets Example</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>

  <body>
    <style>
      body {
        overflow: hidden;
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
      }
      #app {
        display: flex;
        flex-direction: column;
        height: 100vh;
      }
      #top-bar {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 8px 10px;
        background-color: #e8e8e8;
        font-family: sans-serif;
        font-size: 12px;
        border-bottom: 1px solid #ccc;
        flex-wrap: wrap;
      }
      #top-bar label {
        flex-shrink: 0;
      }
      #top-bar select,
      #top-bar input[type='text'] {
        padding: 2px 4px;
      }
      #top-bar button {
        padding: 4px 8px;
      }
      .top-bar-group {
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .top-bar-separator {
        width: 1px;
        height: 20px;
        background-color: #aaa;
        margin: 0 4px;
      }
      #price-display {
        margin-left: auto;
        font-weight: 600;
      }
      #price-value {
        display: inline-block;
        min-width: 70px;
        text-align: right;
      }
      .container {
        display: flex;
        flex: 1;
        min-height: 0;
      }
      .left-section,
      .right-section {
        box-sizing: border-box;
        overflow: auto;
      }
      .left-section {
        padding: 10px;
        flex: 1;
        background-color: #f0f0f0;
        display: none;
        flex-direction: column;
      }
      .right-section {
        flex: 3;
        background-color: #fff;
        position: relative;
        overflow: hidden;
      }
      #tc-area {
        box-sizing: border-box;
      }
      #ui-elements,
      #console-ui-elements,
      #console-log-control-elements,
      #console-log {
        margin-top: 10px;
      }
      #console-log {
        text-align: left;
        font-family: sans-serif;
      }
      #designer {
        width: 100%;
        height: 100%;
        box-sizing: border-box;
        position: absolute;
        left: 0;
        top: 0;
      }
      #designer iframe {
        border: 0;
        border-bottom: 1px solid #e7e7e7;
        border-top: 1px solid #e7e7e7;
      }
      #overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: #fff;
        z-index: 1000;
        overflow-y: scroll;
      }
      #overlay h2 {
        padding-left: 1rem;
      }
      .hidden {
        display: none;
      }
      #designer-container {
        position: relative;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
      }
      .item {
        padding-left: 16px;
      }
    </style>

    <div id="app">
      <div id="top-bar">
        <div class="top-bar-group">
          <label for="preset-select">Preset:</label>
          <select id="preset-select"></select>
        </div>
        <div class="top-bar-group">
          <label for="library-id-input">Library ID:</label>
          <input
            type="text"
            id="library-id-input"
            placeholder="Enter library ID"
          />
        </div>
        <button id="reload-config">Reload with config</button>
        <div class="top-bar-separator"></div>
        <button id="send-to-om">Send to OM</button>
        <div class="top-bar-group">
          <input type="checkbox" id="send-to-om-with-price" checked />
          <label for="send-to-om-with-price">With price</label>
        </div>
        <div class="top-bar-separator"></div>
        <div class="top-bar-group">
          <input type="checkbox" id="toggle-panel" />
          <label for="toggle-panel">Show panel</label>
        </div>
        <div id="price-display" class="top-bar-group" aria-live="polite">
          <span>Price:</span>
          <strong id="price-value">-</strong>
        </div>
      </div>
      <div class="container">
        <div class="left-section">
          <div id="tc-area">
            <div id="ui-elements"></div>
            <div id="console-ui-elements">
              <button
                id="get-snapshot"
                title="Generates and downloads current data and assets of the planning situation. Does not store any data in the database"
              >
                Get snapshot
              </button>
              <button
                id="get-plan-xml"
                title="Generates and downloads the current plan XML. Does not store any data in the database"
              >
                Get plan XML
              </button>
              <button
                id="download-room-contours"
                title="Generates order data and downloads only the room contour information"
              >
                Download room contours
              </button>
              <button id="load-plan-xml" title="Loads a plan XML from a file">
                Load plan XML
              </button>
              <button
                id="save-snapshot"
                title="Save the current data and assets of the planning situation to the data store, then return the URLs to the assets"
              >
                Save snapshot
              </button>
              <button id="calc-price">Calc Price</button>
              <button id="download-om-data">Download OM data</button>
            </div>
            <div id="console-log-control-elements">
              <button id="console-clear" title="Clears the log">Clear</button>
            </div>
            <div id="console-log"></div>
          </div>
        </div>
        <div class="right-section">
          <div id="overlay" class="hidden"></div>
          <div id="designer">
            <div id="designer-container"></div>
          </div>
        </div>
      </div>
    </div>

    <script type="module">
      import RoomleConfiguratorApi from 'https://unpkg.com/@roomle/embedding-lib@7.1.0';
      import {
        libLoadArticleCatalog,
        libLoadCalcScript,
        libLoadMasterData,
        omGetRequest,
        omPostRequest,
        setupHi,
      } from 'https://unpkg.com/@roomle/embedding-lib@7.1.0/hi.js';

      const DEFAULT_PLAN_ID = 'ps_8jjg0zezlblb48vzn8qas9vwwn7fqbg';
      const DEFAULT_SERVER_URL = 'https://www.roomle.com/t/bo-test/';
      const DEFAULT_PRESET = 'HI_DEV_HOMAG_DF_DEV_Testing';
      const EMBEDDING_ID = '948zg40lbmdbthwcoym0m1e4coqa55z';
      const EXTERNAL_ID_PREFIX = '__ext__obj__#';
      const FAKE_ROOT_TAG = 'external:root-tag';
      const HI_AUTH_DATA = `Basic ${btoa('test:6mABjMDnEq4tvaN')}`;
      const HI_SERVER_BASE_URL = 'https://dfscfgtest01-app.azurewebsites.net';
      const HI_ROOT_TAGS = [
        `${EXTERNAL_ID_PREFIX}${FAKE_ROOT_TAG}`,
        'g1a15v0676q3kgibgvu7pqf1nsdykd',
      ];
      const externalObjectSettings = {
        enableArrangementCorrection: true,
        uiConfiguration: {
          userRight: 'Simple',
          showPossibleSubModules: true,
          animatedOpenClose: false,
          showThumbnails: true,
        },
        materialConfiguration: {
          defaultMaterial: 'roomle_script_test:gray_transparent',
        },
        debugConfiguration: { createDebugGeometry: false },
        tecConfigInfo: {
          language: 'en-US,en',
        },
      };

      const getQueryParam = (name) =>
        new URLSearchParams(window.location.search).get(name);
      const queryParamBoolean = (value) => value === 'true';
      const queryParamNumber = (value) => {
        const numberValue = Number(value);
        return Number.isNaN(numberValue) ? undefined : numberValue;
      };
      const setOptionFromQueryParam = (
        target,
        property,
        mapValue = (value) => value,
        defaultValue = undefined,
      ) => {
        const queryValue = getQueryParam(property);
        if (queryValue === null) {
          return;
        }
        const value = mapValue(queryValue);
        if (value !== undefined && value !== null) {
          target[property] = value;
        } else if (defaultValue !== undefined) {
          target[property] = defaultValue;
        }
      };
      const logInUi = (area, message) => {
        const log = document.getElementById('console-log');
        const entry = document.createElement('div');
        entry.innerText = `${area}: ${message}`;
        log.prepend(entry);
      };
      const logMessage = (message, detail = '') => {
        console.log('LOG:', message, detail);
        logInUi('LOG', detail ? `${message}: ${detail}` : message);
      };
      const logApiCall = (message) => {
        console.log('API CALL:', message);
        logInUi('API CALL', message);
      };
      const logLink = (message, linkUrl) => {
        const log = document.getElementById('console-log');
        const entry = document.createElement('div');
        const link = document.createElement('a');
        entry.innerText = `LOG: ${message}: `;
        link.href = linkUrl;
        link.innerText = linkUrl;
        link.target = '_blank';
        entry.appendChild(link);
        log.prepend(entry);
      };
      const downloadBlob = (blob, filename) => {
        const link = document.createElement('a');
        const url = URL.createObjectURL(blob);
        link.href = url;
        link.download = filename;
        document.body.appendChild(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(url);
      };
      const downloadJsonObject = (data, filename) =>
        downloadBlob(
          new Blob([JSON.stringify(data, null, 2)], {
            type: 'application/json',
          }),
          filename,
        );
      const downloadXmlFile = (xml, filename) =>
        downloadBlob(new Blob([xml], { type: 'application/xml' }), filename);
      const parseRoomInformation = (roomInformation) => {
        if (typeof roomInformation !== 'string') {
          return typeof roomInformation === 'object' && roomInformation !== null
            ? roomInformation
            : undefined;
        }
        try {
          const parsedRoomInformation = JSON.parse(roomInformation);
          return typeof parsedRoomInformation === 'object' &&
            parsedRoomInformation !== null
            ? parsedRoomInformation
            : undefined;
        } catch (error) {
          logMessage('ROOM-CONTOURS-ERROR', String(error));
          return undefined;
        }
      };
      const sumRecursiveItemsInCents = (items) => {
        const total = items.find(
          ({ type, priceType }) => type === 'Price' && priceType === 'Total',
        );
        if (total) {
          return Math.round((total.totalPrice ?? 0) * 100);
        }
        return items.reduce((sum, item) => {
          if (item.totalPrice !== undefined) {
            return sum + Math.round(item.totalPrice * 100);
          }
          return item.items?.length
            ? sum + sumRecursiveItemsInCents(item.items)
            : sum;
        }, 0);
      };
      const calculateTotalSum = (structure) =>
        Number(
          (
            (structure?.items?.length
              ? sumRecursiveItemsInCents(structure.items)
              : 0) / 100
          ).toFixed(2),
        );
      const createCoalescingTaskRunner = (task) => {
        let activeRun = null;
        let rerunRequested = false;
        const runLoop = async () => {
          do {
            rerunRequested = false;
            try {
              await task();
            } catch (error) {
              console.error('Task of coalescing task runner failed:', error);
            }
          } while (rerunRequested);
          activeRun = null;
        };
        return () => {
          if (activeRun) {
            rerunRequested = true;
          } else {
            activeRun = runLoop();
          }
          return activeRun;
        };
      };

      const fetchHiPresets = async () => {
        const response = await fetch(`${HI_SERVER_BASE_URL}/backends/list`, {
          headers: { Authorization: HI_AUTH_DATA },
        });
        if (!response.ok) {
          throw new Error(`${response.status} ${response.statusText}`);
        }
        const backends = await response.json();
        if (!Array.isArray(backends) || backends.length === 0) {
          throw new Error('the backend list is empty');
        }
        return Object.fromEntries(
          backends.map((preset) => [preset.backendId, preset]),
        );
      };

      let presets = {};
      try {
        presets = await fetchHiPresets();
      } catch (error) {
        logMessage('HI-PRESETS-ERROR', String(error));
      }
      const presetSelect = document.getElementById('preset-select');
      const libraryIdInput = document.getElementById('library-id-input');
      const presetNames = Object.keys(presets);
      for (const presetName of presetNames) {
        const option = document.createElement('option');
        option.value = presetName;
        option.textContent = presetName;
        presetSelect.appendChild(option);
      }
      const queryBackendId = getQueryParam('backendId');
      const selectedPreset =
        presets[queryBackendId] ??
        presets[DEFAULT_PRESET] ??
        presets[presetNames[0]];
      const selectedBackendId =
        queryBackendId ?? selectedPreset?.backendId ?? '';
      const libraryId =
        getQueryParam('library_id') ?? selectedPreset?.libraryId ?? '';
      let additionalCatalogs = [];
      let configureInRoom = false;
      if (selectedPreset) {
        presetSelect.value = selectedPreset.backendId;
        additionalCatalogs = selectedPreset.additionalCatalogs ?? [];
        configureInRoom = selectedPreset.configureInRoom ?? false;
      }
      libraryIdInput.value = libraryId;
      const reloadWithConfig = (backendId, selectedLibraryId, planId) => {
        const url = new URL(window.location.href);
        url.searchParams.set('backendId', backendId);
        url.searchParams.set('library_id', selectedLibraryId);
        if (planId) {
          url.searchParams.set('plan_id', planId);
        } else {
          url.searchParams.delete('plan_id');
        }
        window.location.href = url.toString();
      };
      presetSelect.addEventListener('change', () => {
        const preset = presets[presetSelect.value];
        libraryIdInput.value = preset.libraryId;
        reloadWithConfig(preset.backendId, preset.libraryId, preset.planId);
      });
      document.getElementById('reload-config').addEventListener('click', () => {
        const preset = presets[presetSelect.value];
        reloadWithConfig(
          preset?.backendId ?? selectedBackendId,
          libraryIdInput.value,
          preset?.planId,
        );
      });

      externalObjectSettings.tecConfigInfo.libraryId = libraryId;
      const userRight = getQueryParam('user_right');
      if (['Simple', 'Advanced', 'Master'].includes(userRight)) {
        externalObjectSettings.uiConfiguration.userRight = userRight;
      }
      const language = getQueryParam('language');
      const hiOptions = {
        libraryId,
        serverOptions: {
          authData: HI_AUTH_DATA || undefined,
          baseUrl: `${HI_SERVER_BASE_URL}/proxy_request?backendId=${encodeURIComponent(selectedBackendId)}&url=`,
          language: language ?? externalObjectSettings.tecConfigInfo.language,
        },
        debugLogging: true,
      };
      const options = {
        id:
          getQueryParam('plan_id') ?? selectedPreset?.planId ?? DEFAULT_PLAN_ID,
        overrideServerUrl: getQueryParam('server_url') ?? DEFAULT_SERVER_URL,
        moc: true,
        saveToIdb: true,
        locale: language ?? externalObjectSettings.tecConfigInfo.language,
        notifications: {
          'first-person-controls': false,
          'interaction.add-element': false,
          'interaction.confirm-ghosts': false,
          'interaction.parameters-changed': false,
          'interaction.root-element': false,
          'stop-configure-hint': false,
        },
        featureFlags: {
          globalCallbacks: false,
          openCloseAnimation: true,
          localExport3d: true,
        },
        webGpuConfig: {
          autoQualityMinFps: 0,
        },
        elements: { bottom_bar: false },
        catalogRootTag: [...HI_ROOT_TAGS, ...additionalCatalogs],
        buttons: {
          swap_product: true,
          export3d: true,
        },
        autoStart: true,
        notifications: {
          'load-idb-config': true,
        },
        configureInRoom: configureInRoom,
        hi: hiOptions,
        externalObjectSettings,
      };
      setOptionFromQueryParam(options, 'unit', (v) => v, 'mm');
      setOptionFromQueryParam(
        options,
        'enableTwoLevelCatalog',
        queryParamBoolean,
        true,
      );
      setOptionFromQueryParam(options, 'debugGeometry', queryParamBoolean);
      setOptionFromQueryParam(options, 'debugLines', queryParamBoolean);
      setOptionFromQueryParam(options, 'debugBoundingBox', queryParamBoolean);
      setOptionFromQueryParam(
        options,
        'envMapIntensity',
        queryParamNumber,
        1.25,
      );
      setOptionFromQueryParam(
        options.featureFlags,
        'mergeOnInsert',
        queryParamBoolean,
      );
      setOptionFromQueryParam(
        options.featureFlags,
        'webGpu',
        queryParamBoolean,
        true,
      );
      setOptionFromQueryParam(
        options.featureFlags,
        'interiorLights',
        queryParamBoolean,
      );
      setOptionFromQueryParam(
        options.featureFlags,
        'advancedHighlighting',
        queryParamBoolean,
        true,
      );
      setOptionFromQueryParam(
        options.externalObjectSettings,
        'transparentHighlighting',
        queryParamBoolean,
        true,
      );
      setOptionFromQueryParam(
        options.externalObjectSettings,
        'enableVerticalDocking',
        queryParamBoolean,
      );
      setOptionFromQueryParam(
        options.externalObjectSettings,
        'maximumCatalogLevel',
        queryParamNumber,
        1,
      );

      let roomDesignerApi;
      let masterDataJson = null;
      let downloadOmData = false;
      const groupMap = new Map();
      const uiMap = new Map();
      const uiContainer = document.getElementById('ui-elements');
      const updatePriceDisplay = async () => {
        if (!roomDesignerApi) {
          return;
        }
        const priceData = await roomDesignerApi.extended.fetchPrice();
        document.getElementById('price-value').innerText = priceData?.orderData
          ? `€ ${calculateTotalSum(priceData.orderData).toFixed(2)}`
          : '-';
      };
      const requestPriceUpdate = createCoalescingTaskRunner(updatePriceDisplay);
      const getThumbnailUrl = (articleName) =>
        masterDataJson?.modules?.find(({ id }) => id === articleName)?.imageUrl;
      const createButton = (action, name, id, thumbnailUrl, clickEvent) => {
        const button = document.createElement('button');
        button.id = `${action}-${id}`;
        if (thumbnailUrl) {
          const image = document.createElement('img');
          image.src = thumbnailUrl;
          image.alt = id;
          image.style.width = '20px';
          image.style.height = '20px';
          image.style.marginRight = '8px';
          image.style.verticalAlign = 'middle';
          button.appendChild(image);
        }
        button.appendChild(
          document.createTextNode(thumbnailUrl ? id : `${name} ${id}`),
        );
        button.addEventListener('click', clickEvent);
        uiContainer.appendChild(button);
        return button;
      };
      const addSubmodules = (submodules, rootId, uiElements) => {
        for (const submodule of submodules) {
          const name = submodule.articleName ?? submodule.name ?? submodule.id;
          uiElements.push(
            createButton(
              'select',
              'sub➚',
              name,
              getThumbnailUrl(submodule.name),
              () =>
                roomDesignerApi.extended.selectExternalObject(
                  rootId,
                  submodule.id,
                  'isolation',
                ),
            ),
          );
          if (submodule.modules) {
            addSubmodules(submodule.modules, rootId, uiElements);
          }
        }
      };
      const clearUiElements = () => {
        for (const uiElements of uiMap.values()) {
          for (const uiElement of uiElements) {
            uiElement.remove();
          }
        }
        uiMap.clear();
      };
      const createUiElements = () => {
        for (const posData of groupMap.values()) {
          for (const root of posData.roots) {
            const uiElements = [];
            uiMap.set(root.id, uiElements);
            const name = root.articleName ?? root.name ?? root.id;
            const thumbnailUrl = getThumbnailUrl(root.name);
            uiElements.push(
              createButton(
                'select',
                'root➚',
                thumbnailUrl ? `${name} ➚` : name,
                thumbnailUrl,
                () =>
                  roomDesignerApi.extended.selectExternalObject(
                    root.id,
                    null,
                    'isolation',
                  ),
              ),
            );
            if (!root.isGenerated && root.canBeDeleted) {
              uiElements.push(
                createButton(
                  'delete',
                  '🗑',
                  thumbnailUrl ? `${name} 🗑` : name,
                  thumbnailUrl,
                  () => roomDesignerApi.extended.removeExternalObject(root.id),
                ),
              );
            }
            if (root.modules) {
              addSubmodules(root.modules, root.id, uiElements);
            }
          }
        }
      };
      const updatePosGroups = (posGroups, operation) => {
        clearUiElements();
        for (const posGroup of posGroups) {
          if (operation === 'delete') {
            groupMap.delete(posGroup);
          } else {
            groupMap.set(posGroup.id, posGroup);
          }
        }
        createUiElements();
        return Promise.resolve();
      };
      const requestHeader = {
        'x-aux-header': libraryId.includes('nobilia') ? 'nobilia' : 'none',
        Authorization: HI_AUTH_DATA,
      };

      await setupHi(hiOptions, {
        onLoadJavascript: () => libLoadCalcScript(hiOptions),
        onLoadArticleCatalog: () => libLoadArticleCatalog(hiOptions),
        onLoadMasterData: async () => {
          masterDataJson = await libLoadMasterData(hiOptions);
          return masterDataJson;
        },
        onPriceCalc: requestPriceUpdate,
        onFetchPrice: async (orderData) => {
          const json = await omPostRequest(
            hiOptions,
            { orderData },
            '/api/price/calculate',
            requestHeader,
          );
          if (json.orderData) {
            logMessage('FETCH-PRICE', json.orderData.id);
          }
          return json;
        },
        onPlaceOrder: async (orderData) => {
          if (downloadOmData) {
            downloadJsonObject(orderData, 'order-to-OM.json');
            return;
          }
          const url = '/api/orderManager/orders/import';
          const json = await omPostRequest(
            hiOptions,
            orderData,
            url,
            requestHeader,
          );
          logMessage('ORDER-RESPONSE', JSON.stringify(json));
          if (!json.correlationId) {
            return;
          }
          const responseOrder = await omGetRequest(
            hiOptions,
            `${url}/${json.correlationId}`,
            requestHeader,
          );
          logMessage('IMPORT-STATUS', JSON.stringify(responseOrder));
          if (responseOrder.link) {
            logLink('OrderManager Order', responseOrder.link);
          }
        },
        onLogMessage: logInUi,
        onPosGroupAdded: (posGroups) => updatePosGroups(posGroups, 'add'),
        onPosGroupChanged: (posGroups) => updatePosGroups(posGroups, 'change'),
        onPosGroupDeleted: (ids) => updatePosGroups(ids, 'delete'),
      });

      roomDesignerApi = await RoomleConfiguratorApi.createPlanner(
        EMBEDDING_ID,
        document.getElementById('designer-container'),
        options,
        ['dragIn'],
      );
      window.instance = roomDesignerApi;
      requestPriceUpdate();
      roomDesignerApi.plugins.dragIn?.beforeUpdateGhost((x, y) => {
        const bounds = document
          .getElementById('overlay')
          .getBoundingClientRect();
        return {
          x,
          y,
          options: {
            ghost: {
              visibleIn: {
                x: bounds.x,
                y: bounds.y,
                height: bounds.height,
                width: bounds.width,
              },
            },
          },
        };
      });

      document
        .getElementById('toggle-panel')
        .addEventListener('change', (event) => {
          document.querySelector('.left-section').style.display = event.target
            .checked
            ? 'flex'
            : 'none';
        });
      document.getElementById('console-clear').addEventListener('click', () => {
        document.getElementById('console-log').replaceChildren();
      });
      document
        .getElementById('get-snapshot')
        .addEventListener('click', async () => {
          logApiCall('getExternalObjectSnapshot');
          const snapshot =
            await roomDesignerApi.extended.getExternalObjectSnapshot();
          if (snapshot) {
            downloadJsonObject(snapshot, 'externalObjectSnapshot.json');
          } else {
            logMessage('No snapshot available');
          }
        });
      document
        .getElementById('get-plan-xml')
        .addEventListener('click', async () => {
          logApiCall('getExternalObjectSnapshot');
          const snapshot =
            await roomDesignerApi.extended.getExternalObjectSnapshot({
              planXML: true,
            });
          if (typeof snapshot?.planXML === 'string') {
            downloadXmlFile(snapshot.planXML, 'planXML.xml');
          } else {
            logMessage('No snapshot available');
          }
        });
      document
        .getElementById('download-room-contours')
        .addEventListener('click', async (event) => {
          const button = event.currentTarget;
          button.disabled = true;
          try {
            logApiCall('getExternalObjectSnapshot');
            const snapshot =
              await roomDesignerApi.extended.getExternalObjectSnapshot({
                orderData: 'room',
              });
            const roomInformation = parseRoomInformation(
              snapshot?.orderData?.roomInformation,
            );
            if (roomInformation) {
              downloadJsonObject(roomInformation, 'roomContours.json');
            } else {
              logMessage('No room contours available');
            }
          } finally {
            button.disabled = false;
          }
        });
      document.getElementById('load-plan-xml').addEventListener('click', () => {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = '.xml';
        input.addEventListener('change', async () => {
          const file = input.files?.[0];
          if (file) {
            logApiCall('loadPlanXml');
            await roomDesignerApi.extended.loadPlanXml(await file.text());
            logMessage('Plan XML loaded successfully');
          }
        });
        input.click();
      });
      document
        .getElementById('save-snapshot')
        .addEventListener('click', async () => {
          logApiCall('saveExternalObjectSnapshot');
          const snapshot =
            await roomDesignerApi.extended.saveExternalObjectSnapshot();
          if (!snapshot) {
            logMessage('No snapshot available');
            return;
          }
          logMessage('Snapshot ID', snapshot.planSnapshotId);
          for (const [name, link] of [
            ['Object GLB', snapshot.objectGlbLink],
            ['Object perspectiveImage', snapshot.perspectiveObjectImageLink],
            ['Object topImage', snapshot.topObjectImageLink],
            ['Plan GLB', snapshot.fullPlanGlbLink],
            ['Plan perspectiveImage', snapshot.perspectiveImageLink],
            ['Plan topImage', snapshot.topImageLink],
          ]) {
            if (link) {
              logLink(name, link);
            }
          }
          downloadJsonObject(snapshot.orderData, 'orderManagerGroupData.json');
        });
      document
        .getElementById('calc-price')
        .addEventListener('click', async (event) => {
          const button = event.currentTarget;
          button.disabled = true;
          try {
            const price = await roomDesignerApi.extended.fetchPrice();
            if (price) {
              downloadJsonObject(price.orderData, 'order-price.json');
            }
          } finally {
            button.disabled = false;
          }
        });
      document
        .getElementById('send-to-om')
        .addEventListener('click', async (event) => {
          const button = event.currentTarget;
          button.disabled = true;
          downloadOmData = false;
          try {
            await roomDesignerApi.extended.placeOrder(
              document.getElementById('send-to-om-with-price').checked,
            );
          } finally {
            button.disabled = false;
          }
        });
      document
        .getElementById('download-om-data')
        .addEventListener('click', async (event) => {
          const button = event.currentTarget;
          button.disabled = true;
          downloadOmData = true;
          try {
            await roomDesignerApi.extended.placeOrder(
              document.getElementById('send-to-om-with-price').checked,
            );
          } finally {
            button.disabled = false;
          }
        });

      // MCP bridge - active only with the mcp=true query parameter. The page
      // connects out to the MCP server in hi-mcp-server.js (which also serves
      // this file) via SSE, executes relayed tool calls against
      // roomDesignerApi.extended, and posts the results back.

      // + 0 turns IEEE -0 into +0 so serialized values never show -0
      const round2 = (value) => Math.round(value * 100) / 100 + 0;
      const toRadians = (degrees) => (degrees * Math.PI) / 180;
      const toDegrees = (radians) => (radians * 180) / Math.PI;
      const normalizeDegrees = (degrees) => {
        const normalized = degrees % 360;
        return normalized < 0 ? normalized + 360 : normalized;
      };

      // The room contour is in plan space (2D floor plane); pos space is the
      // group coordinate space of PosGroup.pos ([x, y, z], y up). The two share
      // the x axis, and the contour y axis is the pos z axis with opposite sign.
      const contourPointToPosSpace = (x, y) => [round2(x), round2(-y)];

      // Side of the room as seen in the top-view plan image (and the default
      // perspective view): a wall a group faces at rotationY 270 lies on the right.
      const sideFromFacing = (facingRotationY) => {
        const bucket = (Math.round(facingRotationY / 90) * 90) % 360;
        if (bucket === 90) {
          return 'left';
        }
        if (bucket === 180) {
          return 'bottom';
        }
        if (bucket === 270) {
          return 'right';
        }
        return 'top';
      };

      const deriveWalls = (room) => {
        const contour =
          room.levels?.find((level) => level.level === 0) ?? room.levels?.[0];
        const segments = contour?.segments ?? [];
        const onlyStraightSegments = segments.every(
          (segment) => segment.cmd === 'M' || segment.cmd === 'L',
        );
        if (segments.length < 2 || !onlyStraightSegments) {
          return [];
        }
        const walls = [];
        for (let index = 0; index + 1 < segments.length; index++) {
          const from = segments[index];
          const to = segments[index + 1];
          const directionX = to.x - from.x;
          const directionY = to.y - from.y;
          const length = Math.hypot(directionX, directionY);
          if (length < 1e-6) {
            continue;
          }
          // The contour runs counter-clockwise with the room interior on its
          // left, so the interior-to-wall direction is (dy, -dx). A group
          // standing against the wall needs its back to face that direction:
          // atan2(-nx, ny).
          const normalX = directionY / length;
          const normalY = -directionX / length;
          const facingRotationY = round2(
            normalizeDegrees(toDegrees(Math.atan2(-normalX, normalY))),
          );
          walls.push({
            index,
            side: sideFromFacing(facingRotationY),
            start: contourPointToPosSpace(from.x, from.y),
            end: contourPointToPosSpace(to.x, to.y),
            lengthMm: round2(length),
            type: to.type,
            heightMm: to.height,
            thicknessMm: to.thickness,
            facingRotationY,
          });
        }
        return walls;
      };

      const transformPointByMatrix = (matrix, point) => {
        const [x, y, z] = point;
        return [
          matrix[0] * x + matrix[4] * y + matrix[8] * z + matrix[12],
          matrix[1] * x + matrix[5] * y + matrix[9] * z + matrix[13],
          matrix[2] * x + matrix[6] * y + matrix[10] * z + matrix[14],
        ];
      };

      const transformPointByRoot = (root, point) => {
        const theta = toRadians(root.rotationY ?? 0);
        const [translationX, translationY, translationZ] = root.articlePos ?? [
          0, 0, 0,
        ];
        const [x, y, z] = point;
        return [
          translationX + x * Math.cos(theta) + z * Math.sin(theta),
          translationY + y,
          translationZ - x * Math.sin(theta) + z * Math.cos(theta),
        ];
      };

      const collectParts = (module, parts) => {
        for (const part of module.parts ?? []) {
          if (
            !part.hidden &&
            (part.relPos?.length ?? 0) >= 3 &&
            (part.dim?.length ?? 0) >= 3 &&
            part.fullMatrix?.length === 16
          ) {
            parts.push(part);
          }
        }
        for (const subModule of module.modules ?? []) {
          collectParts(subModule, parts);
        }
        for (const container of module.containers ?? []) {
          collectParts(container, parts);
        }
      };

      const boxCorners = (minimum, size) => {
        const corners = [];
        for (const offsetX of [0, size[0]]) {
          for (const offsetY of [0, size[1]]) {
            for (const offsetZ of [0, size[2]]) {
              corners.push([
                minimum[0] + offsetX,
                minimum[1] + offsetY,
                minimum[2] + offsetZ,
              ]);
            }
          }
        }
        return corners;
      };

      const dimensionAttribute = (root, attributeId) => {
        const value = Number(
          root.attributes?.find((attribute) => attribute.id === attributeId)
            ?.value,
        );
        return Number.isFinite(value) && value > 0 ? value : undefined;
      };

      const rootFootprintPoints = (root, partMatricesAreGroupSpace) => {
        const parts = [];
        collectParts(root, parts);
        const points = [];
        for (const part of parts) {
          for (const corner of boxCorners(part.relPos, part.dim)) {
            let point = transformPointByMatrix(part.fullMatrix, corner);
            if (!partMatricesAreGroupSpace) {
              point = transformPointByRoot(root, point);
            }
            points.push([point[0], point[2]]);
          }
        }
        if (points.length > 0) {
          return points;
        }
        for (const dockInfo of root.dockInfos ?? []) {
          for (const dockPoint of [dockInfo.start, dockInfo.end]) {
            if ((dockPoint?.length ?? 0) >= 3) {
              const point = transformPointByRoot(root, [
                dockPoint[0],
                dockPoint[1],
                dockPoint[2],
              ]);
              points.push([point[0], point[2]]);
            }
          }
        }
        if (points.length > 0) {
          return points;
        }
        const width = dimensionAttribute(root, 'b');
        const depth = dimensionAttribute(root, 't');
        if (width !== undefined && depth !== undefined) {
          for (const corner of boxCorners([0, 0, 0], [width, 0, depth])) {
            const point = transformPointByRoot(root, corner);
            points.push([point[0], point[2]]);
          }
        }
        return points;
      };

      const groupFootprint = (group) => {
        const partMatricesAreGroupSpace = (group.ver ?? 0) > 0;
        const points = [];
        for (const root of group.roots ?? []) {
          points.push(...rootFootprintPoints(root, partMatricesAreGroupSpace));
        }
        if (points.length === 0) {
          return undefined;
        }
        let minX = Number.POSITIVE_INFINITY;
        let maxX = Number.NEGATIVE_INFINITY;
        let minZ = Number.POSITIVE_INFINITY;
        let maxZ = Number.NEGATIVE_INFINITY;
        for (const [x, z] of points) {
          minX = Math.min(minX, x);
          maxX = Math.max(maxX, x);
          minZ = Math.min(minZ, z);
          maxZ = Math.max(maxZ, z);
        }
        return {
          x: [round2(minX), round2(maxX)],
          z: [round2(minZ), round2(maxZ)],
          widthMm: round2(maxX - minX),
          depthMm: round2(maxZ - minZ),
        };
      };

      // A side label as alignment means: flush into the corner this wall
      // shares with the wall on that side of the room.
      const resolveWallAlignment = (wall, alignment) => {
        if (
          alignment === 'start' ||
          alignment === 'center' ||
          alignment === 'end'
        ) {
          return alignment;
        }
        const axis = alignment === 'left' || alignment === 'right' ? 0 : 1;
        const startCoordinate = wall.start[axis];
        const endCoordinate = wall.end[axis];
        if (Math.abs(startCoordinate - endCoordinate) < 1e-6) {
          throw new Error(
            `Alignment '${alignment}' runs parallel to this '${wall.side}' wall - ` +
              "use 'start', 'center', 'end' or the side of an adjoining wall.",
          );
        }
        const smallerIsCloser = alignment === 'left' || alignment === 'top';
        const startIsCloser = smallerIsCloser
          ? startCoordinate < endCoordinate
          : startCoordinate > endCoordinate;
        return startIsCloser ? 'start' : 'end';
      };

      const placeAgainstWall = (wall, footprint, alignment, offsetMm) => {
        const resolvedAlignment = resolveWallAlignment(wall, alignment);
        const [startX, startZ] = wall.start;
        const [endX, endZ] = wall.end;
        const length = Math.hypot(endX - startX, endZ - startZ);
        const alongX = (endX - startX) / length;
        const alongZ = (endZ - startZ) / length;
        const width = footprint.widthMm;
        let spanStart;
        if (resolvedAlignment === 'start') {
          spanStart = offsetMm;
        } else if (resolvedAlignment === 'end') {
          spanStart = length - width - offsetMm;
        } else {
          spanStart = (length - width) / 2 + offsetMm;
        }
        // The group's local x axis runs against the wall direction, so the
        // group origin corner sits at the far end of the occupied span.
        const anchorX = startX + alongX * (spanStart + width);
        const anchorZ = startZ + alongZ * (spanStart + width);
        const theta = toRadians(wall.facingRotationY);
        const [minX] = footprint.x;
        const [minZ] = footprint.z;
        return {
          pos: [
            round2(anchorX - (minX * Math.cos(theta) + minZ * Math.sin(theta))),
            0,
            round2(
              anchorZ - (-minX * Math.sin(theta) + minZ * Math.cos(theta)),
            ),
          ],
          rotationY: wall.facingRotationY,
        };
      };

      // Only corner articles carry these docking vectors; their start point is
      // the article's corner point, and they run along the two back edges that
      // lie against the two walls of a room corner.
      const CORNER_DOCKING_VECTOR_IDS = [
        'LeftBackTop',
        'RightBackTop',
        'LeftBackBottom',
        'RightBackBottom',
      ];

      const isCornerDockingVector = (id) =>
        CORNER_DOCKING_VECTOR_IDS.includes(id);

      const POINT_EPSILON_MM = 1;

      const samePoint = (a, b) =>
        Math.hypot(a[0] - b[0], a[1] - b[1]) < POINT_EPSILON_MM;

      const unitDirection = (from, to) => {
        const length = Math.hypot(to[0] - from[0], to[1] - from[1]);
        return length < 1e-6
          ? undefined
          : [(to[0] - from[0]) / length, (to[1] - from[1]) / length];
      };

      const rotateDirection = ([x, z], degrees) => {
        const theta = toRadians(degrees);
        return [
          x * Math.cos(theta) + z * Math.sin(theta),
          -x * Math.sin(theta) + z * Math.cos(theta),
        ];
      };

      const sameDirection = (a, b) => a[0] * b[0] + a[1] * b[1] > 0.999;

      const rootCornerGeometry = (root) => {
        const vectorPair = (row) => ({
          left: root.dockInfos?.find(
            (dockInfo) => dockInfo.id === `LeftBack${row}`,
          ),
          right: root.dockInfos?.find(
            (dockInfo) => dockInfo.id === `RightBack${row}`,
          ),
        });
        const bottom = vectorPair('Bottom');
        const { left, right } =
          bottom.left && bottom.right ? bottom : vectorPair('Top');
        if (!left?.start || !left.end || !right?.start || !right.end) {
          return undefined;
        }
        const toGroupXz = (point) => {
          const [x, , z] = transformPointByRoot(root, [
            point[0],
            point[1],
            point[2],
          ]);
          return [x, z];
        };
        const leftStart = toGroupXz(left.start);
        const rightStart = toGroupXz(right.start);
        const leftDirection = unitDirection(leftStart, toGroupXz(left.end));
        const rightDirection = unitDirection(rightStart, toGroupXz(right.end));
        // one corner point and two back edges running along different walls
        if (
          !samePoint(leftStart, rightStart) ||
          !leftDirection ||
          !rightDirection ||
          Math.abs(
            leftDirection[0] * rightDirection[0] +
              leftDirection[1] * rightDirection[1],
          ) > 0.01
        ) {
          return undefined;
        }
        return {
          rootId: root.id ?? '',
          point: rightStart,
          directions: [leftDirection, rightDirection],
        };
      };

      const groupCornerGeometry = (group) => {
        for (const root of group.roots ?? []) {
          const geometry = rootCornerGeometry(root);
          if (geometry) {
            return geometry;
          }
        }
        return undefined;
      };

      const sharedCorner = (wall, other) =>
        [wall.start, wall.end].find((point) =>
          [other.start, other.end].some((candidate) =>
            samePoint(point, candidate),
          ),
        );

      // The wall on the given side of the room that meets this wall in a corner.
      const adjoiningWall = (walls, wall, side) =>
        walls.find(
          (candidate) =>
            candidate.index !== wall.index &&
            candidate.side === side &&
            candidate.type === 'wall' &&
            sharedCorner(wall, candidate) !== undefined,
        );

      // Puts the corner point of a corner article into the corner the two
      // walls share and turns the group so that its two back edges run along
      // the walls. Undefined when the article's back edges cannot be matched
      // to both walls.
      const placeCornerAtWalls = (wall, adjoining, corner, offsetMm) => {
        const cornerPoint = sharedCorner(wall, adjoining);
        if (!cornerPoint) {
          return undefined;
        }
        const otherEnd = (candidate) =>
          samePoint(candidate.start, cornerPoint)
            ? candidate.end
            : candidate.start;
        const alongWall = unitDirection(cornerPoint, otherEnd(wall));
        const alongAdjoining = unitDirection(cornerPoint, otherEnd(adjoining));
        if (!alongWall || !alongAdjoining) {
          return undefined;
        }
        const [leftDirection, rightDirection] = corner.directions;
        const assignments = [
          [alongWall, alongAdjoining],
          [alongAdjoining, alongWall],
        ];
        for (const [leftTarget, rightTarget] of assignments) {
          const angle = toDegrees(
            Math.atan2(leftDirection[1], leftDirection[0]) -
              Math.atan2(leftTarget[1], leftTarget[0]),
          );
          for (const rotationY of [angle, -angle]) {
            if (
              sameDirection(
                rotateDirection(leftDirection, rotationY),
                leftTarget,
              ) &&
              sameDirection(
                rotateDirection(rightDirection, rotationY),
                rightTarget,
              )
            ) {
              const rotatedPoint = rotateDirection(corner.point, rotationY);
              return {
                pos: [
                  round2(
                    cornerPoint[0] - rotatedPoint[0] + alongWall[0] * offsetMm,
                  ),
                  0,
                  round2(
                    cornerPoint[1] - rotatedPoint[1] + alongWall[1] * offsetMm,
                  ),
                ],
                rotationY: round2(normalizeDegrees(rotationY)),
              };
            }
          }
        }
        return undefined;
      };

      const groupPointToRoom = (group, [x, z]) => {
        const [roomX, , roomZ] = transformPointByRoot(
          { articlePos: group.pos, rotationY: group.rotationY },
          [x, 0, z],
        );
        return [roomX, roomZ];
      };

      const footprintCornersInRoom = (footprint, group) => {
        const [minX, maxX] = footprint.x;
        const [minZ, maxZ] = footprint.z;
        return [
          [minX, minZ],
          [maxX, minZ],
          [maxX, maxZ],
          [minX, maxZ],
        ].map((corner) => groupPointToRoom(group, corner));
      };

      const rootFootprintInRoom = (group, root) =>
        rootFootprintPoints(root, (group.ver ?? 0) > 0).map((point) =>
          groupPointToRoom(group, point),
        );

      const edgeNormals = (polygon) => {
        const normals = [];
        for (let index = 0; index < polygon.length; index++) {
          const from = polygon[index];
          const to = polygon[(index + 1) % polygon.length];
          const normal = unitDirection(from, to);
          if (normal) {
            normals.push([-normal[1], normal[0]]);
          }
        }
        return normals;
      };

      const projectOntoAxis = (polygon, [axisX, axisZ]) => {
        let minimum = Number.POSITIVE_INFINITY;
        let maximum = Number.NEGATIVE_INFINITY;
        for (const [x, z] of polygon) {
          const projection = x * axisX + z * axisZ;
          minimum = Math.min(minimum, projection);
          maximum = Math.max(maximum, projection);
        }
        return [minimum, maximum];
      };

      // Two convex footprints touch when no edge normal of either separates
      // them by more than the tolerance (separating axis theorem); flush
      // contact counts.
      const convexPolygonsTouch = (a, b, toleranceMm) => {
        if (a.length < 3 || b.length < 3) {
          return false;
        }
        for (const axis of [...edgeNormals(a), ...edgeNormals(b)]) {
          const [minA, maxA] = projectOntoAxis(a, axis);
          const [minB, maxB] = projectOntoAxis(b, axis);
          if (maxA < minB - toleranceMm || maxB < minA - toleranceMm) {
            return false;
          }
        }
        return true;
      };

      const DEFAULT_SECTIONS = ['rooms', 'articles', 'groups'];

      const MAX_ATTRIBUTE_MATCHES = 20;

      const isRootModule = (module) =>
        module?.isRoot === true || module?.moduleType === 'RootModule';

      const isCustomerFacingAttribute = (attribute) =>
        attribute?.isMain === true || attribute?.userRight === 'Simple';

      const compactSelection = (selection) => {
        const compact = { ...selection };
        delete compact.imageUrl;
        if (compact.desc === compact.name) {
          delete compact.desc;
        }
        return compact;
      };

      const compactAttribute = (attribute) => ({
        id: attribute.id,
        name: attribute.name,
        desc: attribute.desc,
        type: attribute.type,
        group: attribute.group,
        selections: attribute.selections?.map(compactSelection),
      });

      // The root modules and the attributes a customer sees (isMain or
      // userRight Simple). Everything else stays reachable through
      // find-attributes.
      const compactMasterData = (masterData) => {
        const rootModules = (masterData?.modules ?? []).filter(isRootModule);
        const assignedAttributeIds = new Set(
          rootModules.flatMap((module) => module.assignedAttributes ?? []),
        );
        const attributes = (masterData?.attributes ?? []).filter(
          (attribute) =>
            assignedAttributeIds.has(attribute.id) &&
            isCustomerFacingAttribute(attribute),
        );
        const attributeIds = new Set(
          attributes.map((attribute) => attribute.id),
        );
        return {
          libraryId: masterData?.libraryId,
          modules: rootModules.map((module) => ({
            id: module.id,
            name: module.name,
            desc: module.desc,
            attributes: (module.assignedAttributes ?? []).filter((id) =>
              attributeIds.has(id),
            ),
          })),
          attributes: attributes.map(compactAttribute),
        };
      };

      const dockingVectorNames = (root) =>
        (root?.dockInfos ?? [])
          .map((dockInfo) => dockInfo.id)
          .filter((id) => id !== 'CollisionBox');

      const isGeneratedRoot = (root) => root?.isGenerated === true;

      // The docking vectors of a root that no contextData entry uses -
      // derived from the docking, not from geometry.
      const freeDockingVectors = (root) => {
        const used = new Set(
          (root?.contextData?.dockedRoots ?? [])
            .filter((dockedContext) => dockedContext?.dockedRoots?.length)
            .map((dockedContext) => dockedContext.ownDockingVector),
        );
        return dockingVectorNames(root).filter((name) => !used.has(name));
      };

      const PARTNER_VECTOR = {
        LeftBottom: 'RightBottom',
        RightBottom: 'LeftBottom',
        LeftTop: 'LeftBottom',
        RightTop: 'RightBottom',
        BackBottom: 'BackBottom',
        BackTop: 'BackBottom',
      };

      const CONTACT_TOLERANCE_MM = 5;

      // The existing group whose footprint the placed footprint touches or
      // overlaps, with the root of that group nearest to the placed footprint.
      const findGroupContact = (placedCorners, groups, excludedGroupIds) => {
        const center = [
          placedCorners.reduce((sum, [x]) => sum + x, 0) / placedCorners.length,
          placedCorners.reduce((sum, [, z]) => sum + z, 0) /
            placedCorners.length,
        ];
        for (const group of groups) {
          if (excludedGroupIds.has(group.id)) {
            continue;
          }
          const footprint = groupFootprint(group);
          if (
            !footprint ||
            !convexPolygonsTouch(
              placedCorners,
              footprintCornersInRoom(footprint, group),
              CONTACT_TOLERANCE_MM,
            )
          ) {
            continue;
          }
          let nearestRoot;
          let nearestDistance = Number.POSITIVE_INFINITY;
          for (const root of group.roots ?? []) {
            if (isGeneratedRoot(root)) {
              continue;
            }
            for (const [x, z] of rootFootprintInRoom(group, root)) {
              const distance = Math.hypot(x - center[0], z - center[1]);
              if (distance < nearestDistance) {
                nearestDistance = distance;
                nearestRoot = root;
              }
            }
          }
          return { group, root: nearestRoot ?? group.roots?.[0] };
        }
        return undefined;
      };

      const contactError = (what, contact) => {
        const free = freeDockingVectors(contact.root);
        const sideVector = free.find(
          (name) => name.endsWith('Bottom') && !name.includes('Back'),
        );
        const example = sideVector
          ? ` - e.g. on root '${contact.root.id}': { "ownDockingVector": "${sideVector}", "dockedRoots": [{ "id": "<new root>", "dockingVector": "${PARTNER_VECTOR[sideVector]}", "mode": "StartStart", "offset": [0, 0, 0] }] }`
          : '';
        return (
          `${what} would meet group '${contact.group.id}' (root '${contact.root.id}', article ${contact.root.articleId}; ` +
          `free docking vectors: ${free.join(', ') || 'none'}). Units next to an existing group are roots of that group: ` +
          `take group '${contact.group.id}' from get-plan-context, add the new roots docked to a free vector of the root they ` +
          `continue${example}, and resubmit it with its id. A new group with a placement is only for a free stretch of wall.`
        );
      };

      const stripDockingIndices = (contextData) => ({
        dockedRoots: (contextData?.dockedRoots ?? []).map((dockedContext) => ({
          ownDockingVector: dockedContext.ownDockingVector,
          dockedRoots: (dockedContext.dockedRoots ?? []).map((dockedRoot) => ({
            id: dockedRoot.id,
            dockingVector: dockedRoot.dockingVector,
            ...(dockedRoot.mode !== undefined && { mode: dockedRoot.mode }),
            ...(dockedRoot.offset !== undefined && {
              offset: dockedRoot.offset,
            }),
          })),
        })),
      });

      // The only shape a root module takes on its way from the agent to the
      // planner: an article pick with attribute overrides and docking. Root
      // positions never travel; the arrangement derives them from contextData.
      const toArticlePick = (root) => ({
        id: root.id,
        articleId: root.articleId,
        ...(root.libraryId && { libraryId: root.libraryId }),
        ...(root.attributes?.length && {
          attributes: root.attributes.map((attribute) => ({
            id: attribute.id,
            value: attribute.value,
          })),
        }),
        ...(root.contextData && {
          contextData: stripDockingIndices(root.contextData),
        }),
      });

      // The planner's own roots on the way back into the planner: unchanged
      // apart from the positions and the docking indices.
      const withoutPositions = (root) => {
        const copy = { ...root };
        delete copy.articlePos;
        delete copy.rotationY;
        if (copy.contextData) {
          copy.contextData = stripDockingIndices(copy.contextData);
        }
        return copy;
      };

      // The group placement expressed as the room transform of one root
      // module, so the planner derives the group position from its own
      // arrangement and no root position has to travel in the payload.
      const repositioningFromPlacement = (placement, anchor) => {
        const [x, y, z] = transformPointByRoot(
          { articlePos: placement.pos, rotationY: placement.rotationY },
          [
            anchor.articlePos?.[0] ?? 0,
            anchor.articlePos?.[1] ?? 0,
            anchor.articlePos?.[2] ?? 0,
          ],
        );
        return {
          posGroup: [round2(x), round2(y), round2(z)],
          posRotationY: round2(
            normalizeDegrees(placement.rotationY + (anchor.rotationY ?? 0)),
          ),
          rootId: anchor.id,
        };
      };

      // A calculated group sent back with a new placement: the placement
      // becomes repositioningData of the first article root, the library
      // regenerates the generated roots (worktop, toe kick), and no root
      // carries a position.
      const repositionedGroup = (resultGroup, placement) => {
        const roots = (resultGroup.roots ?? []).filter(
          (root) => !isGeneratedRoot(root),
        );
        const anchor = roots[0];
        if (!anchor) {
          throw new Error(
            `Group '${resultGroup.id}' has no article root to place.`,
          );
        }
        return {
          id: resultGroup.id,
          ...(resultGroup.libraryId && { libraryId: resultGroup.libraryId }),
          roots: roots.map(withoutPositions),
          repositioningData: repositioningFromPlacement(placement, anchor),
        };
      };

      // The docking vectors of the calculated roots in the plan by article
      // id - the fallback for an article template that does not carry its own.
      const calculatedDockingVectorsByArticle = (groups) => {
        const byArticle = new Map();
        for (const group of groups) {
          for (const root of group.roots ?? []) {
            const names = dockingVectorNames(root);
            if (
              root.articleId &&
              names.length > 0 &&
              !byArticle.has(root.articleId)
            ) {
              byArticle.set(root.articleId, names);
            }
          }
        }
        return byArticle;
      };

      const compactArticle = (
        article,
        masterData,
        calculatedDockingVectors,
      ) => {
        const attributeInfos = new Map(
          (masterData?.attributes ?? []).map((attribute) => [
            attribute.id,
            attribute,
          ]),
        );
        const moduleInfos = new Map(
          (masterData?.modules ?? []).map((module) => [module.id, module]),
        );
        const namedValue = (attribute) => ({
          id: attribute.id,
          name: attributeInfos.get(attribute.id).name,
          value: attribute.value,
        });
        const rootModules = (article.roots ?? []).map((root) => {
            const moduleInfo = moduleInfos.get(root.name);
            const attributes = (root.attributes ?? []).filter((attribute) =>
              attributeInfos.has(attribute.id),
            );
            const dimensions = attributes.filter(
              (attribute) => attributeInfos.get(attribute.id).type === 'Dim',
            );
            const dimensionIds = new Set(
              dimensions.map((attribute) => attribute.id),
            );
            const templateVectors = dockingVectorNames(root);
            return {
              module: {
                id: root.name,
                name: moduleInfo?.name,
                desc: moduleInfo?.desc,
              },
              dimensions: dimensions.map(namedValue),
              mainAttributes: attributes
                .filter(
                  (attribute) =>
                    attributeInfos.get(attribute.id).isMain === true &&
                    !dimensionIds.has(attribute.id),
                )
                .map(namedValue),
              dockingVectors:
                templateVectors.length > 0
                  ? templateVectors
                  : (calculatedDockingVectors.get(article.articleId) ?? []),
              insertLevels: root.insertLevelInfos,
              subModules: (root.modules ?? []).map((module) => ({
                id: module.name,
                name: moduleInfos.get(module.name)?.name ?? module.name,
              })),
            };
          });
        return {
          articleId: article.articleId,
          articleName: article.articleName,
          desc: article.desc,
          imageUrl: article.imageUrl,
          category: article.category,
          libraryId: article.libraryId,
          catalog: article.catalog,
          cornerArticle: rootModules.some((rootModule) =>
            rootModule.dockingVectors.some(isCornerDockingVector),
          ),
          rootModules,
        };
      };

      const attributeMatches = (attribute, needle) =>
        [
          attribute.id,
          attribute.name,
          attribute.desc,
          attribute.group,
          ...(attribute.selections ?? []).flatMap((selection) => [
            selection.name,
            selection.desc,
            selection.value,
          ]),
        ].some(
          (value) =>
            value !== undefined &&
            value !== null &&
            String(value).toLowerCase().includes(needle),
        );

      // A root as the agent sees it: the article pick it can resubmit (id,
      // articleId, input attributes, docking) plus read-only facts. No
      // positions, no geometry.
      const shapeRoot = (root) => ({
        id: root.id,
        articleId: root.articleId,
        articleName: root.articleName,
        desc: root.desc,
        category: root.category,
        ...(isGeneratedRoot(root) && { isGenerated: true }),
        attributes: (root.attributes ?? [])
          .filter((attribute) => attribute.isInput === true)
          .map((attribute) => ({ id: attribute.id, value: attribute.value })),
        ...(root.contextData && {
          contextData: stripDockingIndices(root.contextData),
        }),
        dockingVectors: dockingVectorNames(root),
        freeDockingVectors: freeDockingVectors(root),
        subModules: (root.modules ?? []).map((module) => module.name),
        ...(root.logMessages?.length && { logMessages: root.logMessages }),
      });

      // A group as the agent sees it: resubmittable as it is (the read-only
      // position block and the generated roots are dropped on the way back).
      const shapeGroup = (group) => ({
        id: group.id,
        libraryId: group.libraryId,
        position: {
          pos: group.pos,
          rotationY: group.rotationY,
          footprint: groupFootprint(group),
        },
        ...(group.attributes && { attributes: group.attributes }),
        roots: (group.roots ?? []).map(shapeRoot),
        logMessages: group.logMessages ?? [],
      });

      const shapeRooms = (rooms) => {
        if (!rooms) {
          return rooms;
        }
        return {
          ...rooms,
          rooms: (rooms.rooms ?? []).map((room) => ({
            ...room,
            walls: deriveWalls(room),
          })),
        };
      };

      const isArticlePickOnly = (root) =>
        !root?.posData && !root?.modules && !root?.parts;

      // A root authored by the agent is just an article pick (id, articleId,
      // optional attribute overrides and docking contextData). The glue logic
      // completes it from the article template; here the article id is
      // validated against the catalog so the agent gets a helpful error
      // instead of a half-calculated group.
      const validateArticlePickIds = async (api, posGroups) => {
        const articlePicks = posGroups.flatMap((group) =>
          (group?.roots ?? []).filter(isArticlePickOnly),
        );
        if (articlePicks.length === 0) {
          return;
        }
        const context = await api.extended.getExternalObjectPlanContext([
          'articles',
        ]);
        const articles = context.articles ?? [];
        for (const root of articlePicks) {
          const article = articles.find(
            (candidate) =>
              candidate.articleId === root.articleId &&
              (!root.libraryId || candidate.libraryId === root.libraryId),
          );
          if (!article) {
            const validIds = articles.map((candidate) => candidate.articleId);
            throw new Error(
              `articleId '${root.articleId}' is not in the article catalog. ` +
                `Valid article ids: ${validIds.slice(0, 100).join(', ')}`,
            );
          }
        }
      };

      const WALL_SIDES = ['left', 'right', 'top', 'bottom'];
      const ALIGNMENTS = ['start', 'center', 'end', ...WALL_SIDES];

      const resolveWall = (rooms, spec) => {
        const roomIndex = spec.roomIndex ?? 0;
        const room = rooms[roomIndex];
        if (!room) {
          throw new Error(
            `Room index ${roomIndex} not found - the plan has ${rooms.length} room(s).`,
          );
        }
        const walls = deriveWalls(room);
        let wall;
        if (typeof spec.wall === 'number') {
          wall = walls.find((candidate) => candidate.index === spec.wall);
        } else if (typeof spec.wall === 'string') {
          // side label: the longest real wall on that side of the room
          wall = walls
            .filter(
              (candidate) =>
                candidate.side === spec.wall && candidate.type === 'wall',
            )
            .sort((a, b) => b.lengthMm - a.lengthMm)[0];
        }
        if (!wall) {
          throw new Error(
            `Wall '${spec.wall}' not found. Pass a side label (left/right/top/bottom) or a wall index. ` +
              'Available walls: ' +
              JSON.stringify(walls),
          );
        }
        // fails early on an alignment that runs parallel to the wall
        resolveWallAlignment(wall, spec.alignment ?? 'center');
        return { wall, walls };
      };

      // A corner article is placed by its corner point when the alignment
      // names the adjoining wall; every other group is placed by its footprint.
      const placeGroupAtWall = (group, { wall, walls }, spec) => {
        const footprint = groupFootprint(group);
        if (!footprint) {
          throw new Error(
            `Group '${group.id}' has no geometry to derive a footprint from.`,
          );
        }
        const alignment = spec.alignment ?? 'center';
        const offsetMm = spec.offsetMm ?? 0;
        if (WALL_SIDES.includes(alignment)) {
          const corner = groupCornerGeometry(group);
          const adjoining = adjoiningWall(walls, wall, alignment);
          if (corner && adjoining) {
            const placement = placeCornerAtWalls(
              wall,
              adjoining,
              corner,
              offsetMm,
            );
            if (placement) {
              return {
                ...placement,
                footprint,
                placedBy: 'cornerPoint',
                cornerRootId: corner.rootId,
              };
            }
          }
        }
        const placement = placeAgainstWall(wall, footprint, alignment, offsetMm);
        return { ...placement, footprint, placedBy: 'footprint' };
      };

      const mcpToolExecutors = {
        'get-plan-context': async (api, args) => {
          const requested =
            Array.isArray(args.include) && args.include.length > 0
              ? args.include
              : DEFAULT_SECTIONS;
          const sections = new Set(requested);
          // the compact articles need the attribute types and module names of
          // the master data and the docking vectors of the calculated roots
          const fetched = new Set(requested);
          if (sections.has('articles')) {
            fetched.add('masterData');
            fetched.add('groups');
          }
          const context = await api.extended.getExternalObjectPlanContext([
            ...fetched,
          ]);
          const masterData = context.masterData ?? {};
          const result = {};
          if (sections.has('masterData')) {
            result.masterData = Object.fromEntries(
              Object.entries(masterData).map(
                ([libraryId, libraryMasterData]) => [
                  libraryId,
                  compactMasterData(libraryMasterData),
                ],
              ),
            );
          }
          if (sections.has('rooms')) {
            result.rooms = shapeRooms(context.rooms);
          }
          if (sections.has('articles')) {
            const calculatedDockingVectors = calculatedDockingVectorsByArticle(
              context.groups ?? [],
            );
            result.articles = (context.articles ?? []).map((article) =>
              compactArticle(
                article,
                masterData[article.libraryId],
                calculatedDockingVectors,
              ),
            );
          }
          if (sections.has('groups')) {
            result.groups = context.groups?.map(shapeGroup);
          }
          return result;
        },

        'find-attributes': async (api, args) => {
          const needle = String(args.text ?? '')
            .trim()
            .toLowerCase();
          if (needle.length === 0) {
            throw new Error('text must not be empty.');
          }
          const libraryId = args.libraryId;
          const context = await api.extended.getExternalObjectPlanContext([
            'masterData',
          ]);
          const matches = [];
          for (const [id, masterData] of Object.entries(
            context.masterData ?? {},
          )) {
            if (libraryId && id !== libraryId) {
              continue;
            }
            const rootModules = (masterData.modules ?? []).filter(
              isRootModule,
            );
            for (const attribute of masterData.attributes ?? []) {
              if (!attributeMatches(attribute, needle)) {
                continue;
              }
              matches.push({
                libraryId: id,
                ...compactAttribute(attribute),
                userRight: attribute.userRight,
                rootModules: rootModules
                  .filter((module) =>
                    (module.assignedAttributes ?? []).includes(attribute.id),
                  )
                  .map((module) => module.id),
              });
            }
          }
          return {
            matches: matches.slice(0, MAX_ATTRIBUTE_MATCHES),
            total: matches.length,
            ...(matches.length > MAX_ATTRIBUTE_MATCHES && {
              hint: `Only the first ${MAX_ATTRIBUTE_MATCHES} of ${matches.length} matches are listed - narrow the text.`,
            }),
          };
        },

        'create-or-replace-groups': async (api, args) => {
          const posGroups = args.posGroups;
          const validationErrors = [];
          posGroups.forEach((group, groupIndex) => {
            if (!Array.isArray(group?.roots) || group.roots.length === 0) {
              validationErrors.push(
                `posGroups[${groupIndex}]: needs a non-empty roots array`,
              );
              return;
            }
            // the library regenerates its generated roots (worktop, toe kick)
            group.roots = group.roots.filter((root) => !isGeneratedRoot(root));
            if (group.roots.length === 0) {
              validationErrors.push(
                `posGroups[${groupIndex}]: needs at least one article root (generated roots are dropped)`,
              );
              return;
            }
            if (group.pos !== undefined || group.rotationY !== undefined) {
              validationErrors.push(
                `posGroups[${groupIndex}]: do not set pos/rotationY on a group - position it with placement or repositioningData`,
              );
            }
            const rootIds = new Set();
            group.roots.forEach((root, rootIndex) => {
              for (const field of ['id', 'articleId']) {
                const value = root?.[field];
                if (typeof value !== 'string' || value.length === 0) {
                  validationErrors.push(
                    `posGroups[${groupIndex}].roots[${rootIndex}]: ${field} must be a non-empty string` +
                      (field === 'articleId'
                        ? ' (an article id from the catalog)'
                        : ''),
                  );
                }
              }
              if (
                root?.articlePos !== undefined ||
                root?.rotationY !== undefined
              ) {
                validationErrors.push(
                  `posGroups[${groupIndex}].roots[${rootIndex}]: a root module carries no articlePos/rotationY - ` +
                    'root positions come from the docking (contextData) only, the group position from placement or repositioningData',
                );
              }
              const rootId = root?.id;
              if (typeof rootId === 'string' && rootId.length > 0) {
                if (rootIds.has(rootId)) {
                  validationErrors.push(
                    `posGroups[${groupIndex}].roots[${rootIndex}]: duplicate root id '${rootId}' - every root id must be unique within its group`,
                  );
                }
                rootIds.add(rootId);
              }
            });
            if (group.roots.length > 1) {
              const dockedRootIds = new Set();
              for (const root of group.roots) {
                for (const dockedContext of root?.contextData?.dockedRoots ??
                  []) {
                  if (dockedContext?.dockedRoots?.length) {
                    dockedRootIds.add(root.id);
                  }
                  for (const dockedRoot of dockedContext?.dockedRoots ?? []) {
                    dockedRootIds.add(dockedRoot?.id);
                  }
                }
              }
              const undockedRoots = group.roots.filter(
                (root) => !dockedRootIds.has(root.id),
              );
              const undockedLimit = dockedRootIds.size === 0 ? 1 : 0;
              if (undockedRoots.length > undockedLimit) {
                const ids = undockedRoots.map((root) => `'${root.id}'`);
                validationErrors.push(
                  `posGroups[${groupIndex}]: roots ${ids.join(', ')} are not related by docking - ` +
                    'undocked roots all land at the same spot and look like a single unit. Dock every ' +
                    'additional root to a placed root by listing it on that root, e.g. to place root B directly right of root A: ' +
                    '{ "id": "A", "articleId": "...", "contextData": { "dockedRoots": [{ "ownDockingVector": "RightBottom", ' +
                    '"dockedRoots": [{ "id": "B", "dockingVector": "LeftBottom", "mode": "StartStart", ' +
                    '"offset": [0, 0, 0] }] }] } }',
                );
              }
            }
            const placement = group.placement;
            if (placement !== undefined) {
              const wallValid =
                (typeof placement?.wall === 'string' &&
                  WALL_SIDES.includes(placement.wall)) ||
                (typeof placement?.wall === 'number' &&
                  Number.isInteger(placement.wall) &&
                  placement.wall >= 0);
              if (!wallValid) {
                validationErrors.push(
                  `posGroups[${groupIndex}].placement: wall must be a side label (${WALL_SIDES.join('/')}) or a wall index`,
                );
              }
              if (
                placement?.alignment !== undefined &&
                !ALIGNMENTS.includes(placement.alignment)
              ) {
                validationErrors.push(
                  `posGroups[${groupIndex}].placement: alignment must be one of ${ALIGNMENTS.join(', ')}`,
                );
              }
            }
            if (
              placement !== undefined &&
              group.repositioningData !== undefined
            ) {
              validationErrors.push(
                `posGroups[${groupIndex}]: use either placement or repositioningData, not both`,
              );
            }
          });
          if (validationErrors.length > 0) {
            throw new Error(
              'Invalid pos groups - nothing was loaded:\n' +
                validationErrors.join('\n') +
                '\nFetch the payload format with the get-authoring-rules tool.',
            );
          }
          // Only article picks, placement and repositioningData reach the planner.
          for (const group of posGroups) {
            group.roots = group.roots.map(toArticlePick);
            for (const field of Object.keys(group)) {
              if (
                ![
                  'id',
                  'libraryId',
                  'roots',
                  'placement',
                  'repositioningData',
                ].includes(field)
              ) {
                delete group[field];
              }
            }
          }
          await validateArticlePickIds(api, posGroups);

          // Declarative wall placements: resolve the walls before anything is
          // loaded (so a bad wall fails the whole call), remember which input
          // groups carry one, apply them after the calculation when the
          // footprints exist. New group ids are regenerated by the planner, so
          // created groups are matched to their placements by order of
          // appearance.
          const placementSpecs = new Map();
          const preContext = await api.extended.getExternalObjectPlanContext([
            'rooms',
            'groups',
          ]);
          const rooms = preContext.rooms?.rooms ?? [];
          const beforeGroupIds = new Set(
            (preContext.groups ?? []).map((group) => group.id),
          );
          posGroups.forEach((group, groupIndex) => {
            if (group.placement !== undefined) {
              const spec = group.placement;
              placementSpecs.set(groupIndex, {
                spec,
                resolved: resolveWall(rooms, spec),
              });
              delete group.placement;
            }
          });

          const loaded = await api.extended.loadExternalObjectGroupLayout(
            { posGroups },
            'posGroups',
            // 'adjusted' makes the planner re-apply the group pos/rotationY
            // when a group is replaced; without it a replace keeps the old
            // position.
            { reason: 'adjusted' },
          );
          if (!loaded || loaded.length === 0) {
            throw new Error(
              'No groups were created or replaced. Check that each root module name is a master-data ' +
                'module id and the articleId comes from the article catalog (see get-plan-context), ' +
                'and that the payload follows the rules returned by get-authoring-rules.',
            );
          }
          let context = await api.extended.getExternalObjectPlanContext([
            'groups',
          ]);

          const placements = [];
          if (placementSpecs.size > 0) {
            const afterGroups = context.groups ?? [];
            const newGroupIds = afterGroups
              .map((group) => group.id)
              .filter((id) => !beforeGroupIds.has(id));
            const groupsOfThisCall = new Set([
              ...newGroupIds,
              ...posGroups.map((group) => group.id).filter(Boolean),
            ]);
            const contactErrors = [];
            const placedGroups = [];
            let newGroupCursor = 0;
            posGroups.forEach((group, groupIndex) => {
              const isReplace = group.id && beforeGroupIds.has(group.id);
              const resultGroupId = isReplace
                ? group.id
                : newGroupIds[newGroupCursor++];
