name: Deploy hi-mcp to Cloudflare
run-name: Deploy hi-mcp to Cloudflare ${{ github.ref_name == 'release/cloudflare.dev' && 'DEV' || 'PRD' }}

on:
  push:
    branches:
      - release/cloudflare
      - release/cloudflare.dev

concurrency:
  group: deploy-cloudflare-${{ github.ref_name }}
  cancel-in-progress: false

env:
  WRANGLER_ENV: ${{ github.ref_name == 'release/cloudflare.dev' && 'dev' || '' }}
  MCP_SERVER_URL: ${{ github.ref_name == 'release/cloudflare.dev' && 'https://hi-planning-assistant-dev.dashiell-bell.workers.dev' || 'https://hi-planning-assistant.dashiell-bell.workers.dev' }}

jobs:
  deploy:
    name: Test, build image & deploy Worker
    runs-on: ubuntu-24.04
    environment: ${{ github.ref_name == 'release/cloudflare.dev' && 'cloudflare-dev' || 'cloudflare' }}
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Type-check and test
        working-directory: hi-mcp
        run: |
          npm run typecheck
          npx tsc --noEmit --project cf/tsconfig.json
          npm test

      - name: Deploy (builds and pushes the container image with Docker)
        working-directory: hi-mcp/cf
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy --env="$WRANGLER_ENV"

      - name: Verify the MCP endpoint answers
        run: |
          status=$(curl -sf --retry 5 --retry-all-errors --max-time 60 -o /dev/null -w '%{http_code}' \
            -X POST "$MCP_SERVER_URL/mcp" \
            -H 'content-type: application/json' -H 'accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}')
          echo "initialize $MCP_SERVER_URL/mcp: HTTP $status"
          test "$status" = 200
