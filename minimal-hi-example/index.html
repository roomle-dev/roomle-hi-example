              const placementEntry = placementSpecs.get(groupIndex);
              if (!placementEntry) {
                return;
              }
              const resultGroup = afterGroups.find(
                (candidate) => candidate.id === resultGroupId,
              );
              if (!resultGroup) {
                return;
              }
              const placement = placeGroupAtWall(
                resultGroup,
                placementEntry.resolved,
                placementEntry.spec,
              );
              // a placement that meets another group is a docking relation
              // expressed as a position: the roots belong into that group
              const contact = findGroupContact(
                footprintCornersInRoom(placement.footprint, placement),
                afterGroups,
                groupsOfThisCall,
              );
              if (contact) {
                contactErrors.push(
                  contactError(
                    `posGroups[${groupIndex}] placed at the ${placementEntry.resolved.wall.side} wall`,
                    contact,
                  ),
                );
                return;
              }
              placedGroups.push(repositionedGroup(resultGroup, placement));
              placements.push({
                groupId: resultGroup.id,
                wall: placementEntry.resolved.wall.side,
                placedBy: placement.placedBy,
                ...(placement.cornerRootId && {
                  cornerRootId: placement.cornerRootId,
                }),
              });
            });
            if (contactErrors.length > 0) {
              // nothing of this call stays: the created groups are removed
              // again, replaced groups keep their new roots but were not moved
              for (const id of newGroupIds) {
                api.extended.removeExternalObject(id);
              }
              throw new Error(
                'Placement rejected - the groups created by this call were removed again' +
                  (posGroups.some((group) => beforeGroupIds.has(group.id))
                    ? ', replaced groups were not moved'
                    : '') +
                  ':\n' +
                  contactErrors.join('\n'),
              );
            }
            if (placedGroups.length > 0) {
              await api.extended.loadExternalObjectGroupLayout(
                { posGroups: placedGroups },
                'posGroups',
                { reason: 'adjusted' },
              );
              context = await api.extended.getExternalObjectPlanContext([
                'groups',
              ]);
            }
          }

          const groups = context.groups?.map(shapeGroup);
          const replacedInputIds = new Set(
            posGroups
              .map((group) => group.id)
              .filter((id) => id && beforeGroupIds.has(id)),
          );
          const unpositionedGroupIds = (groups ?? [])
            .filter(
              (group) =>
                group.position.pos === undefined &&
                (!beforeGroupIds.has(group.id) || replacedInputIds.has(group.id)),
            )
            .map((group) => group.id);
          return {
            loaded,
            groups,
            ...(placements.length > 0 && { placements }),
            ...(unpositionedGroupIds.length > 0 && {
              hint:
                `Groups ${unpositionedGroupIds.join(', ')} are not positioned yet and sit at the plan origin. ` +
                'Give the group a placement ({ wall, alignment?, offsetMm? }) in create-or-replace-groups ' +
                'or call place-group to stand it against a wall.',
            }),
          };
        },

        'place-group': async (api, args) => {
          const groupId = args.groupId;
          const wallArg = args.wall ?? args.wallIndex;
          const roomIndex = args.roomIndex ?? 0;
          const alignment = args.alignment ?? 'center';
          const offsetMm = args.offsetMm ?? 0;
          const context = await api.extended.getExternalObjectPlanContext([
            'rooms',
            'groups',
          ]);
          const groups = context.groups ?? [];
          let group = groups.find((candidate) => candidate.id === groupId);
          if (!group && groupId) {
            const prefixMatches = groups.filter((candidate) =>
              candidate.id.startsWith(groupId),
            );
            if (prefixMatches.length === 1) {
              group = prefixMatches[0];
            }
          }
          if (!group) {
            const groupIds = groups.map((candidate) => candidate.id);
            throw new Error(
              `Group '${groupId}' not found. Groups in the plan: ` +
                `${groupIds.join(', ') || 'none'}.`,
            );
          }
          const rooms = context.rooms?.rooms ?? [];
          const spec = { wall: wallArg, alignment, offsetMm, roomIndex };
          const resolved = resolveWall(rooms, spec);
          const placement = placeGroupAtWall(group, resolved, spec);
          const contact = findGroupContact(
            footprintCornersInRoom(placement.footprint, placement),
            groups,
            new Set([group.id]),
          );
          if (contact) {
            throw new Error(
              'Placement rejected - the group was not moved: ' +
                contactError(
                  `Group '${group.id}' placed at the ${resolved.wall.side} wall`,
                  contact,
                ),
            );
          }
          const loaded = await api.extended.loadExternalObjectGroupLayout(
            { posGroups: [repositionedGroup(group, placement)] },
            'posGroups',
            { reason: 'adjusted' },
          );
          if (!loaded || loaded.length === 0) {
            throw new Error(
              `Group '${groupId}' could not be reloaded at the new position.`,
            );
          }
          const after = await api.extended.getExternalObjectPlanContext([
            'groups',
          ]);
          const resultGroup = (after.groups ?? []).find(
            (candidate) => candidate.id === group.id,
          );
          return {
            pos: placement.pos,
            rotationY: placement.rotationY,
            footprint: placement.footprint,
            placedBy: placement.placedBy,
            ...(placement.cornerRootId && {
              cornerRootId: placement.cornerRootId,
            }),
            wall: resolved.wall,
            group: resultGroup ? shapeGroup(resultGroup) : undefined,
          };
        },

        'update-attribute': async (api, args) => {
          await api.extended.updateExternalObjectGroupAttribute(
            args.rootModuleId,
            args.moduleId ?? null,
            args.attributeId,
            args.value,
          );
          return { ok: true };
        },

        'get-price': async (api) => {
          return api.extended.fetchPrice();
        },

        'get-order-data': async (api) => {
          const snapshot = await api.extended.getExternalObjectSnapshot({
            orderData: true,
          });
          return snapshot?.orderData ?? null;
        },

        'get-plan-images': async (api) => {
          const snapshot = await api.extended.getExternalObjectSnapshot({
            perspectiveImage: true,
            topImage: true,
          });
          return {
            perspectiveImage: snapshot?.perspectiveImage,
            topImage: snapshot?.topImage,
          };
        },
      };

      const startMcpBrowserBridge = (api) => {
        const bridgeUrl = `/bridge?url=${encodeURIComponent(window.location.href)}`;
        const reply = (result) =>
          fetch('/bridge/result', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(result),
          }).catch((error) => console.error('[hi-mcp] reply failed', error));
        const connect = () => {
          const source = new EventSource(bridgeUrl);
          source.onopen = () =>
            logMessage('MCP', 'connected to the MCP server');
          source.onmessage = async (event) => {
            let message;
            try {
              message = JSON.parse(event.data);
            } catch {
              return;
            }
            if (message.kind !== 'call') {
              return;
            }
            const executor = mcpToolExecutors[message.tool];
            if (!executor) {
              reply({
                kind: 'result',
                id: message.id,
                ok: false,
                error: `Unknown tool: ${message.tool}`,
              });
              return;
            }
            logApiCall(`MCP ${message.tool}`);
            try {
              const result = await executor(api, message.args);
              reply({ kind: 'result', id: message.id, ok: true, result });
            } catch (error) {
              console.error('[hi-mcp] tool failed', message.tool, error);
              reply({
                kind: 'result',
                id: message.id,
                ok: false,
                error: error instanceof Error ? error.message : String(error),
              });
            }
          };
          // EventSource reconnects on its own; only a closed source (the
          // server was gone) needs a manual restart
          source.onerror = () => {
            if (source.readyState === EventSource.CLOSED) {
              source.close();
              setTimeout(connect, 3000);
            }
          };
        };
        connect();
      };

      if (getQueryParam('mcp') === 'true') {
        startMcpBrowserBridge(roomDesignerApi);
      }
    </script>
  </body>
</html>
