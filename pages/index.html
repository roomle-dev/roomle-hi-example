<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HOMAG Intelligence Examples</title>
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        font-family: system-ui, sans-serif;
        color: #ffffff;
        background:
          linear-gradient(rgba(0, 0, 0, 0.55), rgba(0, 0, 0, 0.25)),
          #2b2622 url('assets/ligna-store-kitchen.jpg') center / cover no-repeat;
      }

      h1 {
        margin: 0;
        padding: 2rem 2rem 1rem;
        font-size: 1.75rem;
        font-weight: 600;
        text-shadow: 0 1px 6px rgba(0, 0, 0, 0.6);
      }

      main {
        flex: 1;
        display: grid;
        place-items: center;
        padding: 1rem 1rem 4rem;
      }

      ul {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 2rem;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      a {
        position: relative;
        display: block;
        width: 16rem;
        aspect-ratio: 1;
        overflow: hidden;
        border-radius: 4px;
        color: inherit;
        text-decoration: none;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
      }

      a:focus-visible {
        outline: 3px solid #dd1818;
        outline-offset: 4px;
      }

      img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 200ms ease-out;
      }

      a:hover img,
      a:focus-visible img {
        transform: scale(1.05);
      }

      span {
        position: absolute;
        inset: auto 0 0;
        padding: 2.5rem 1.25rem 1.1rem;
        background: linear-gradient(transparent, rgba(0, 0, 0, 0.8));
        font-size: 1.2rem;
        font-weight: 600;
      }
    </style>
  </head>

  <body>
    <h1>HOMAG Intelligence Examples</h1>
    <main>
      <ul>
        <li>
          <a href="hi-sc/">
            <img src="assets/homag-intelligence.jpg" alt="" />
            <span>HI Sales Configurator</span>
          </a>
        </li>
        <li>
          <a href="nobilia-minifabrik/">
            <img src="assets/homag-intelligence.jpg" alt="" />
            <span>nobilia Minifabrik</span>
          </a>
        </li>
        <li>
          <a href="https://www.roomle.com/t/ligna-store/">
            <img src="assets/ligna-store.jpg" alt="" />
            <span>Ligna Store</span>
          </a>
        </li>
      </ul>
    </main>
  </body>
</html>
